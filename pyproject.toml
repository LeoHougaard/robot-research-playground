[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-playground"
version = "0.1.0"
description = "Disposable research agents with persistent robot experiment evidence"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hardware = ["pyserial>=3.5,<4", "opencv-contrib-python>=4.10,<5"]

[project.scripts]
playground = "playground.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
