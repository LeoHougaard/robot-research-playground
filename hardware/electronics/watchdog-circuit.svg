<text x="1335" y="1110" class="label" font-family="Arial,sans-serif" fill="#132238" font-size="24px" font-weight="bold">Adapter GND</text>
<path d="M1120 995V1020M1120 1075V1100" class="wire" fill="none" stroke="#24374a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<rect x="1107" y="1020" width="26" height="55" class="part" fill="white" stroke="#24374a" stroke-width="3" />
<circle cx="1120" cy="995" r="5" class="dot" fill="#24374a" /><circle cx="1120" cy="1100" r="5" class="dot" fill="#24374a" />
<text x="1160" y="1055" class="small" font-family="Arial,sans-serif" fill="#132238" font-size="19px">R8 1 kOhm, 0.5 W bleeder</text>
<text x="1160" y="1084" class="tiny" font-family="Arial,sans-serif" fill="#132238" font-size="17px">Stored energy decay must be measured</text>
<text x="70" y="1188" class="small" font-family="Arial,sans-serif" fill="#132238" font-size="19px">S1B second NC contact: GPIO27 -&gt; contact -&gt; GND. R9 330 Ohm pulls GPIO27 to 3V3, about 10 mA sense current.</text>
<text x="70" y="1223" class="small" font-family="Arial,sans-serif" fill="#132238" font-size="19px">10 uF C4 across local 3V3/GND. Common signal GND; motor return must bypass ESP32 USB ground wiring.</text>
<rect x="45" y="1250" width="2110" height="155" rx="10" class="note" fill="#fff4dc" stroke="#d7af54" stroke-width="2" />
<text x="70" y="1290" class="label" font-family="Arial,sans-serif" fill="#132238" font-size="24px" font-weight="bold">Timing and qualification</text>
<text x="70" y="1325" font-family="Arial,sans-serif" fill="#132238" font-size="22px">82 kOhm x 1.5 uF x typical K ~0.48 at 3.3 V gives inferred ~59 ms. Rising edges every 40 ms retrigger U1.</text>
<text x="70" y="1360" font-family="Arial,sans-serif" fill="#132238" font-size="22px">Measure Q timeout50-70 ms, supply disconnect and actual motor cessation&lt;=100 ms. Diode release and rail capacitance count.</text>
<text x="70" y="1390" class="small" font-family="Arial,sans-serif" fill="#132238" font-size="19px">Exact pin netlist and parts: netlist.json / bill-of-materials.csv. Firmware gate stays0 until bench checks pass; no certified safety claim.</text>
